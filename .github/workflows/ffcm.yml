# Lee de la web de la FFCM calendario, horarios, pabellones y clasificación y los guarda
# en data/ para que las plantillas se rellenen solas.
# Se ejecuta cada mañana (la FFCM va publicando horas y cambios de fecha durante la semana),
# a mano desde la pestaña Actions (también desde la app de GitHub en el móvil) y cuando
# cambia el propio lector.
name: Datos de la FFCM

on:
  schedule:
    - cron: "0 6 * * *" # todos los días a las 06:00 UTC (7:00-8:00 en España)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - herramientas/ffcm.mjs
      - .github/workflows/ffcm.yml

permissions:
  contents: write

concurrency:
  group: ffcm
  cancel-in-progress: false

jobs:
  # Cada categoría en una máquina distinta (con su propia conexión): la FFCM empieza a dar
  # páginas vacías tras muchas consultas seguidas desde la misma conexión.
  leer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        equipo: [senior, juvenil]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leer la FFCM (${{ matrix.equipo }})
        run: node herramientas/ffcm.mjs ${{ matrix.equipo }} 2>&1 | tee registro-${{ matrix.equipo }}.txt; exit ${PIPESTATUS[0]}

      # Si la lectura falla no hay JSON nuevo y se conservan los datos anteriores.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffcm-${{ matrix.equipo }}
          path: |
            data/ffcm-${{ matrix.equipo }}.json
            registro-${{ matrix.equipo }}.txt

  guardar:
    needs: leer
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Guardar los datos en el repositorio
        run: |
          for e in senior juvenil; do
            if [ -f "descargas/ffcm-$e/data/ffcm-$e.json" ]; then cp "descargas/ffcm-$e/data/ffcm-$e.json" data/; fi
          done
          cat descargas/*/registro-*.txt > data/ffcm-registro.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ffcm-*.json data/ffcm-registro.txt
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos de la FFCM ($(date -u +%Y-%m-%d))"
            git push
          fi
