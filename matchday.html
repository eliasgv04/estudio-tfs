<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0b100c">
  <link rel="icon" href="assets/club/favicon.png">
  <link rel="apple-touch-icon" href="assets/club/icono-180.png">
  <title>Matchday</title>
  <link rel="stylesheet" href="css/fuentes.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main>
    <header class="cabecera">
      <a href="./" class="volver"><img src="assets/club/escudo-blanco.png" alt=""><span>Inicio</span></a>
      <h1 class="titulo-mixto en-linea"><b>MATCH</b><em>day</em></h1>
      <div class="formato" role="radiogroup" aria-label="Formato">
        <label><input type="radio" name="formato" value="post"><span>Post</span></label>
        <label><input type="radio" name="formato" value="story"><span>Story</span></label>
      </div>
    </header>
    <section>
      <div class="vista-envoltura">
        <canvas id="vista" width="1024" height="1024"></canvas>
      </div>
      <p class="pista">Arrastra sobre cada foto para encuadrarla.</p>
    </section>

    <form onsubmit="return false">

      <fieldset>
        <legend>Fotos</legend>
        <label class="boton boton-archivo">
          <span id="nombre-foto-0">Foto de arriba</span>
          <input type="file" id="foto-0" accept="image/*">
        </label>
        <label><span id="nombre-zoom-0">Zoom arriba</span>
          <input type="range" id="zoom-0" min="1" max="3" step="0.01">
        </label>
        <label class="solo-juvenil" hidden>Oscurecer la parte de abajo
          <input type="range" id="velo" min="0" max="0.9" step="0.01">
        </label>
        <label class="boton boton-archivo solo-senior">
          Foto del medio
          <input type="file" id="foto-1" accept="image/*">
        </label>
        <label class="solo-senior">Zoom medio
          <input type="range" id="zoom-1" min="1" max="3" step="0.01">
        </label>
        <label class="boton boton-archivo solo-senior">
          Foto de abajo
          <input type="file" id="foto-2" accept="image/*">
        </label>
        <label class="solo-senior">Zoom abajo
          <input type="range" id="zoom-2" min="1" max="3" step="0.01">
        </label>
      </fieldset>

      <fieldset>
        <legend>Partido</legend>
        <div class="opciones">
          <label><input type="radio" name="equipo" value="senior"> Sénior</label>
          <label><input type="radio" name="equipo" value="juvenil"> Juvenil</label>
        </div>
        <div class="opciones">
          <label><input type="radio" name="campo" value="casa"> En casa (local)</label>
          <label><input type="radio" name="campo" value="fuera"> Fuera (visitante)</label>
        </div>
        <label>Rival
          <input type="text" id="rival" placeholder="Piedrabuena FS" autocomplete="off">
        </label>
        <label>Elegir rival (pone nombre y escudo)
          <select id="escudo-rival"><option value="">— Otro / sin escudo —</option></select>
        </label>
        <label class="boton boton-archivo">
          Subir otro escudo (PNG en blanco)
          <input type="file" id="subir-escudo" accept="image/png">
        </label>
        <div class="fila">
          <label>Hora
            <input type="time" id="hora">
          </label>
          <label>Entrada (€)
            <input type="number" id="entrada" inputmode="decimal" min="0" step="0.5" placeholder="—">
          </label>
        </div>
        <label>Pabellón
          <input type="text" id="pabellon" autocomplete="off">
        </label>
      </fieldset>

      <button type="button" class="boton" id="exportar">Guardar imagen</button>
    </form>
  </main>

  <script src="js/lienzo.js"></script>
  <script src="js/estudio.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/ffcm.js"></script>
  <script src="js/matchday.js"></script>
</body>
</html>
